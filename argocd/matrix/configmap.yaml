apiVersion: v1
kind: ConfigMap
metadata:
  name: element-config
  namespace: app-matrix
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.umee.sh",
          "server_name": "matrix.umee.sh"
        }
      },
      "disable_guests": true,
      "disable_3pid_login": true,
      "brand": "Element",
      "roomDirectory": {
        "servers": ["matrix.umee.sh"]
      }
    }
