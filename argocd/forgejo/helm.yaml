apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-helm
  namespace: argocd
spec:
  project: default
  source:
    chart: forgejo
    repoURL: code.forgejo.org/forgejo-helm
    # ref: https://code.forgejo.org/forgejo-helm/forgejo-helm/releases
    targetRevision: 17.0.1
    helm:
      valuesObject:
        global:
          storageClass: local-storage
        persistence:
          size: 1Gi
        gitea:
          admin:
            passwordMode: initialOnlyRequireReset
            existingSecret: forgejo-admin-secret
          config:
            server:
              ROOT_URL: https://git.umee.sh/
            service:
              # DISABLE_REGISTRATION: "true"
            actions:
              ENABLED: "false"
            database:
              DB_TYPE: postgres
              HOST: forgejo-pg-rw.app-forgejo.svc.cluster.local:5432
              NAME: app
              USER: app
        deployment:
          env:
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-pg-app
                  key: password
  destination:
    server: "https://kubernetes.default.svc"
    namespace: app-forgejo
  syncPolicy:
    automated:
      prune: true
