apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: app-hermes-agent
  labels:
    app: hermes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:sha-a91a57fa5a13d516c38b07a141a9ce8a3daabeb0 # v0.14.0
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: hermes-agent-data
              mountPath: /opt/data
            - name: hermes-agent-secret-volume
              mountPath: /opt/data/.env
              subPath: .env
            - name: hermes-agent-config-volume
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "512m"
            limits:
              memory: "1024Mi"
              cpu: "2048m"
      volumes:
        - name: hermes-agent-secret-volume
          secret:
            secretName: hermes-agent-secret
        - name: hermes-agent-config-volume
          configMap:
            name: hermes-agent-config
  volumeClaimTemplates:
    - metadata:
        name: hermes-agent-data
      spec:
        storageClassName: local-storage
        accessModes: ["ReadWriteOnce"]
        selector:
          matchLabels:
            app: hermes-agent
            type: data
        resources:
          requests:
            storage: 1Gi
