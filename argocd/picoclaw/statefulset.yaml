apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: picoclaw
  namespace: app-picoclaw
  labels:
    app: picoclaw
spec:
  replicas: 1
  serviceName: ""
  selector:
    matchLabels:
      app: picoclaw
  template:
    metadata:
      labels:
        app: picoclaw
    spec:
      containers:
        - name: picoclaw
          image: ghcr.io/sipeed/picoclaw@sha256:96cc44c0598a7ab5d13ec140b2087b646078f8a684a9bbbec901b8c69512ac4e # v0.2.6
          ports:
            - containerPort: 18790
              name: http
          volumeMounts:
            - name: picoclaw-workspaces
              mountPath: /root/.picoclaw/workspace
            - name: picoclaw-secret-volume
              mountPath: /root/.picoclaw/.security.yml
              subPath: .security.yml
            - name: picoclaw-config-volume
              mountPath: /root/.picoclaw/config.json
              subPath: config.json
      volumes:
        - name: picoclaw-secret-volume
          secret:
            secretName: picoclaw-secret
        - name: picoclaw-config-volume
          configMap:
            name: picoclaw-config
  volumeClaimTemplates:
    - metadata:
        name: picoclaw-workspaces
      spec:
        storageClassName: local-storage
        accessModes: ["ReadWriteOnce"]
        selector:
          matchLabels:
            app: picoclaw
            type: workspaces
        resources:
          requests:
            storage: 1Gi
